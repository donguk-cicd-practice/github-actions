name: create_repo-workflow
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'set repo prefix'
        required: true
        default: 'service'
        type: choice
        options:
          - example
          - service
      name:
        description: 'set repo name'
        required: true
        default: 'github-actions'
        type: string

jobs:
  create_repo-job:
    runs-on: ubuntu-latest
    steps:
      - name: gh auth login
        run: |
          echo ${{ secrets.PERSONAL_ACCESS_TOKEN }} | gh auth login --with-token
      - name: create-repo
        id: create-repo
        run: |
          gh repo create donguk-cicd-practice/${{ inputs.prefix }}-${{ inputs.name }} --public --add-readme
      - name: slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "GitHub Action 결과 알림",
              "attachments": [
                {
                  "pretext": "create repo result",
                  "color": "#36a64f",
                  "fields": [
                    {
                      "title": "create repo result ${{ steps.create-repo.outcome }}",
                      "short": true,
                      "value": "${{ steps.create-repo.outcome }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}