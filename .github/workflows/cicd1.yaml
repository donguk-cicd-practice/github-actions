name: cicd1-workflow
on:
  pull_request:
    types:
      - opened
      - synchronize
      - closed
    branches:
      - dev

jobs:
  test-job:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

  image-build-job:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

  deploy-job:
    runs-on: ubuntu-latest
    needs: image-build-job
    steps:
      - name: checkout
        uses: actions/checkout@v4